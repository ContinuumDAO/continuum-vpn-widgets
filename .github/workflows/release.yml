name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Ubuntu package
        run: bash ubuntu/scripts/build-deb.sh
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Continuum VPN widgets $version" \
            --notes "Ubuntu 24.04 and 26.04 package. Install the .deb, then import or paste a profile bundle from the node VPN panel." \
            "continuum-vpn-widget_amd64.deb" \
            "continuum-vpn-widget_${version}_amd64.deb"
