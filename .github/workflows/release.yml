name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Ubuntu, Arch, Fedora, and openSUSE packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd rpm
          bash ubuntu/scripts/build-deb.sh
          bash arch/scripts/build-pkg.sh
          bash fedora/scripts/build-rpm.sh
          bash opensuse/scripts/build-rpm.sh
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Continuum VPN widgets $version" \
            --notes "Ubuntu 24.04 and 26.04: install the .deb, then import or paste a profile bundle from the node VPN panel. Arch Linux: sudo pacman -U ./continuum-vpn-widget-${version}-1-x86_64.pkg.tar.zst. Fedora: sudo dnf install ./continuum-vpn-widget-${version}-1.x86_64.rpm. openSUSE: sudo zypper install --allow-unsigned-rpm ./continuum-vpn-widget-${version}-1.suse.x86_64.rpm. macOS: unzip the app, move it to Applications, then Control-click it and choose Open so Gatekeeper allows the first launch." \
            "continuum-vpn-widget_amd64.deb" \
            "continuum-vpn-widget_${version}_amd64.deb" \
            "continuum-vpn-widget-x86_64.pkg.tar.zst" \
            "continuum-vpn-widget-${version}-1-x86_64.pkg.tar.zst" \
            "continuum-vpn-widget-x86_64.rpm" \
            "continuum-vpn-widget-${version}-1.x86_64.rpm" \
            "continuum-vpn-widget-suse.x86_64.rpm" \
            "continuum-vpn-widget-${version}-1.suse.x86_64.rpm"
  macos:
    needs: deb
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the macOS apps
        run: bash macos/scripts/build-app.sh
      - name: Upload the macOS apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "continuum-vpn-widget-macos-arm64.zip" \
            "continuum-vpn-widget-${version}-macos-arm64.zip" \
            "continuum-vpn-widget-macos-x64.zip" \
            "continuum-vpn-widget-${version}-macos-x64.zip"
